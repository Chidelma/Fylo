[package]
name = "fylo-storage-native"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
base64.workspace = true
fylo-format = { version = "0.1.0", path = "../fylo-format" }
fylo-query = { version = "0.1.0", path = "../fylo-query" }
fylo-vfs = { version = "0.1.0", path = "../fylo-vfs" }
getrandom.workspace = true
hmac.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true

# Inode identity has no meaning on a host filesystem, which has no links.
[target.'cfg(not(target_family = "wasm"))'.dependencies]
same-file.workspace = true

[target.'cfg(unix)'.dependencies]
xattr.workspace = true

[target.'cfg(target_vendor = "apple")'.dependencies]
rustix.workspace = true

[lints]
workspace = true
