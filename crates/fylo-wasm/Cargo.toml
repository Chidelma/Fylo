[package]
name = "fylo-wasm"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
fylo-machine = { version = "0.1.0", path = "../fylo-machine" }
fylo-vfs = { version = "0.1.0", path = "../fylo-vfs" }
getrandom.workspace = true

# The module's imports and its exported buffer handoff both cross a boundary no
# safe signature can express. ADR 0008 confines that to this crate's boundary
# module, one `SAFETY:` justification per block.
[lints.rust]
unsafe_code = "deny"
unused_must_use = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
