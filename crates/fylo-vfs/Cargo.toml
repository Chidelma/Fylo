[package]
name = "fylo-vfs"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]

# The host boundary passes raw pointers and lengths, which no safe signature can
# express. ADR 0008 confines that to `host.rs`; `deny` rather than `forbid` is
# what lets that one module opt in with a documented justification per block.
[lints.rust]
unsafe_code = "deny"
unused_must_use = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
