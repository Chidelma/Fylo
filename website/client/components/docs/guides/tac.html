<div class="doc-section doc-section--wide">
  <h2>Everything else</h2>
  <p>
    Each page below is the complete reference for its surface, not a summary that

    the browser engine, and the language shims, the page says so.
  </p>

  <div class="w-grid-row guide-row">
    <loop :for="let guide of guides">
      <div class="w-grid-col-12 w-grid-col-sm-6 w-grid-col-lg-4">

          <p>{guide.text}</p>
        </a>
      </div>
    </loop>
  </div>
</div>
