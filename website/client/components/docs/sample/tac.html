<div class="doc-sample">

        <button
            type="button"

            on:click="showLang('python')"
        >

        </button>
        <button
            type="button"

        </button>
        <button
            type="button"

        <button
            type="button"

        <button

        </button>
        <button
            type="button"

            class="w-btn w-btn-ghost w-btn--sm"

            data-lang="csharp"

        </button>
        <button
            type="button"
            class="w-btn w-btn-ghost w-btn--sm"

        <button
