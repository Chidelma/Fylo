name: Rust engine

on:
    pull_request:
        branches: [main]
        paths:
            - '.github/workflows/rust.yml'
            - '.github/workflows/rust-nightly.yml'
            - 'Cargo.lock'
            - 'Cargo.toml'
            - 'VERSION'
            - 'api/**'
            - 'crates/**'
            - 'fuzz/**'
            - 'deny.toml'
            - 'package.json'
            - 'playwright.config.mjs'
            - 'rust-toolchain.toml'
            - 'rust-miri-toolchain.toml'
            - 'rustfmt.toml'
            - 'scripts/**'
            - 'src/**'
            - 'tests/browser/wasm-index.test.js'
            - 'tests/browser/e2e/**'
            - 'tests/browser/fixtures/wasm-opfs.*'
            - 'tests/fixtures/rust-*.json'
            - 'xtask/**'
    push:
        branches:
            - main
            - codex/rust-rewrite
        paths:
            - '.github/workflows/rust.yml'
            - '.github/workflows/rust-nightly.yml'
            - 'Cargo.lock'
            - 'Cargo.toml'
            - 'VERSION'
            - 'api/**'
            - 'crates/**'
            - 'fuzz/**'
            - 'deny.toml'
            - 'package.json'
            - 'playwright.config.mjs'
            - 'rust-toolchain.toml'
            - 'rust-miri-toolchain.toml'
            - 'rustfmt.toml'
            - 'scripts/**'
            - 'src/**'
            - 'tests/browser/wasm-index.test.js'
            - 'tests/browser/e2e/**'
            - 'tests/browser/fixtures/wasm-opfs.*'
            - 'tests/fixtures/rust-*.json'
            - 'xtask/**'

permissions:
    contents: read

concurrency:
    group: rust-${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    quality:
        name: Format, lint, test, and dependency policy
        runs-on: ubuntu-latest
        timeout-minutes: 20

        steps:
            - name: Check out source
              uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

            - name: Set up Bun
              uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
              with:
                  bun-version-file: .bun-version

            - name: Install JavaScript dependencies
              run: bun install --frozen-lockfile

            - name: Install pinned TTID and CHEX binaries
              shell: bash
              run: |
                  bun run vendor:install
                  if command -v cygpath >/dev/null 2>&1; then
                      cygpath -w "$HOME/.local/bin" >> "$GITHUB_PATH"
                  else
                      echo "$HOME/.local/bin" >> "$GITHUB_PATH"
                  fi

            - name: Install pinned Rust toolchain
              run: rustup show active-toolchain

            - name: Verify workspace identity
              run: bun run rust:verify

            - name: Verify versioned contracts
              run: |
                  bun run contracts:verify
                  bun run query:verify
                  bun run predicate:verify
                  bun run sql:verify

            - name: Check Rust formatting
              run: bun run rust:fmt

            - name: Run Clippy
              run: bun run rust:clippy

            - name: Run Rust tests
              run: bun run rust:test

            - name: Verify JavaScript-to-Rust read-only interoperability
              run: |
                  bun run rust:interop:readonly
                  bun run golden:smoke

            - name: Install cargo-deny
              run: bun ./scripts/run-rust.mjs cargo install cargo-deny --version 0.19.4 --locked

            - name: Check dependency policy
              run: bun run rust:deny

    wasm:
        name: Wasm target and browser fallback
        runs-on: ubuntu-latest
        timeout-minutes: 20

        steps:
            - name: Check out source
              uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

            - name: Set up Bun
              uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
              with:
                  bun-version-file: .bun-version

            - name: Install dependencies
              run: bun install --frozen-lockfile

            - name: Install pinned Rust toolchain
              run: rustup show active-toolchain

            - name: Build browser client with Wasm
              run: bun run build:web:wasm

            - name: Run Wasm integration and fallback tests
              run: bun test tests/browser/wasm-index.test.js --timeout 120000 --parallel=1
              env:
                  FYLO_REQUIRE_WASM: '1'

            - name: Enforce browser payload budgets
              run: bun ./scripts/verify-browser-wasm-budgets.mjs --output target/wasm-budget.json

            - name: Retain payload budget evidence
              uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
              with:
                  name: rust-browser-wasm-budget
                  path: target/wasm-budget.json
                  if-no-files-found: error
                  retention-days: 90

    browser-wasm:
        name: Browser Wasm and OPFS (${{ matrix.browser }})
        runs-on: ubuntu-latest
        timeout-minutes: 20
        strategy:
            fail-fast: false
            matrix:
                browser: [chromium, firefox, webkit]

        steps:
            - name: Check out source
              uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

            - name: Set up Bun
              uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
              with:
                  bun-version-file: .bun-version

            - name: Install dependencies
              run: bun install --frozen-lockfile

            - name: Install browser and system dependencies
              run: node ./node_modules/@playwright/test/cli.js install --with-deps ${{ matrix.browser }}

            - name: Install pinned Rust toolchain
              run: rustup show active-toolchain

            - name: Build browser client with Wasm
              run: bun run build:web:wasm

            - name: Run real-browser OPFS, restart, fallback, and benchmark corpus
              run: >-
                  node ./node_modules/@playwright/test/cli.js test
                  --project=${{ matrix.browser }}

            - name: Retain browser qualification evidence
              if: always()
              uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
              with:
                  name: rust-browser-wasm-${{ matrix.browser }}
                  path: test-results
                  if-no-files-found: warn
                  retention-days: 90

    portable-miri:
        name: Portable kernel under Miri
        runs-on: ubuntu-latest
        timeout-minutes: 20

        steps:
            - name: Check out source
              uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

            - name: Install pinned Miri toolchain
              run: |
                  rustup toolchain install nightly-2026-07-20 --profile minimal --component miri,rust-src
                  cargo +nightly-2026-07-20 miri setup

            - name: Run portable crates under Miri
              run: cargo +nightly-2026-07-20 miri test -p fylo-format -p fylo-query --lib --tests

    native-read-only:
        name: Native read-only (${{ matrix.os }})
        runs-on: ${{ matrix.os }}
        timeout-minutes: 25
        strategy:
            fail-fast: false
            matrix:
                os: [ubuntu-latest, macos-latest, windows-latest]

        steps:
            - name: Check out source
              uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

            - name: Set up Bun
              uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
              with:
                  bun-version-file: .bun-version

            - name: Install dependencies
              run: bun install --frozen-lockfile

            - name: Install pinned TTID and CHEX binaries
              shell: bash
              run: |
                  bun run vendor:install
                  if command -v cygpath >/dev/null 2>&1; then
                      cygpath -w "$HOME/.local/bin" >> "$GITHUB_PATH"
                  else
                      echo "$HOME/.local/bin" >> "$GITHUB_PATH"
                  fi

            - name: Install pinned Rust toolchain
              run: rustup show active-toolchain

            - name: Test native read-only crates
              run: bun ./scripts/run-rust.mjs cargo test --locked -p fylo-storage-native -p fylo-engine -p fylo-cli

            - name: Verify current-engine interoperability
              run: bun run rust:interop:readonly

            - name: Verify native write and crash-recovery interoperability
              run: bun run rust:interop:writes

            - name: Verify native encrypted write interoperability
              run: bun run rust:interop:encrypted

            - name: Verify native versioned commit interoperability
              run: bun run rust:interop:versioned

            - name: Verify native machine protocol conformance
              run: bun run rust:interop:machine

            - name: Recover every interrupted native durable transition
              run: bun run rust:crash:matrix

            - name: Replay one operation log into cloned roots
              run: bun run rust:replay

            - name: Benchmark current and native read-only engines
              run: >-
                  bun ./scripts/benchmark-rust-readonly.mjs
                  --documents 250
                  --iterations 40
                  --warmup 10
                  --output target/benchmarks/read-only-${{ runner.os }}.json

            - name: Retain read-only benchmark evidence
              if: always()
              uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
              with:
                  name: rust-read-only-benchmark-${{ runner.os }}
                  path: target/benchmarks/read-only-${{ runner.os }}.json
                  if-no-files-found: error
                  retention-days: 90

    released-oracle:
        name: Released oracle (${{ matrix.target }})
        runs-on: ${{ matrix.os }}
        timeout-minutes: 30
        strategy:
            fail-fast: false
            matrix:
                include:
                    - os: ubuntu-latest
                      target: linux-x64
                      asset: fylo-linux-x64
                      sha256: fc1c0ee3fb18d6f5278be4135871cabe5e074234d406deb5f0ded8062b556f2e
                    - os: macos-latest
                      target: macos-arm64
                      asset: fylo-macos-arm64
                      sha256: ae39a2b66ea9771766f3f3d6b3d0d1b01e1b3842a45aa0389535109b91bdee50
                    - os: windows-latest
                      target: windows-x64
                      asset: fylo-windows-x64.exe
                      sha256: 2b3083fb86989e2408f6a5027923a8efe1595783b64c0a149624adb7154885dd

        steps:
            - name: Check out source
              uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

            - name: Set up Bun
              uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
              with:
                  bun-version-file: .bun-version

            - name: Install dependencies
              run: bun install --frozen-lockfile

            - name: Install pinned TTID and CHEX binaries
              shell: bash
              run: |
                  bun run vendor:install
                  if command -v cygpath >/dev/null 2>&1; then
                      cygpath -w "$HOME/.local/bin" >> "$GITHUB_PATH"
                  else
                      echo "$HOME/.local/bin" >> "$GITHUB_PATH"
                  fi

            - name: Install pinned Rust toolchain
              run: rustup show active-toolchain

            - name: Download pinned released JavaScript engine
              shell: bash
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  set -euo pipefail
                  mkdir -p target/oracle-bin
                  gh release download v26.30.06 \
                    --repo d31ma/Fylo \
                    --pattern '${{ matrix.asset }}' \
                    --dir target/oracle-bin
                  chmod +x 'target/oracle-bin/${{ matrix.asset }}' || true

            - name: Record released compatibility root
              run: >-
                  bun ./scripts/record-released-rust-oracle.mjs
                  --binary target/oracle-bin/${{ matrix.asset }}
                  --release v26.30.06
                  --expected-sha256 ${{ matrix.sha256 }}
                  --output target/oracles/${{ matrix.target }}

            - name: Verify current-engine compatibility
              run: >-
                  bun ./scripts/verify-rust-golden-root.mjs
                  --input target/oracles/${{ matrix.target }}

            - name: Build Rust read-only verifier
              run: >-
                  bun ./scripts/run-rust.mjs cargo build
                  --locked -p fylo-cli --bin fylo-rust

            - name: Verify released root with Rust
              run: >-
                  bun ./scripts/verify-released-rust-oracle.mjs
                  --input target/oracles/${{ matrix.target }}

            - name: Verify metadata-sidecar restoration
              run: >-
                  bun ./scripts/smoke-released-rust-oracle-restore.mjs
                  --input target/oracles/${{ matrix.target }}

            - name: Retain released compatibility root
              uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
              with:
                  name: rust-released-oracle-v26.30.06-${{ matrix.target }}
                  path: target/oracles/${{ matrix.target }}
                  if-no-files-found: error
                  retention-days: 90
