name: Rust engine

on:
    pull_request:
        branches: [main]
        paths:
            - '.github/workflows/rust.yml'
            - 'Cargo.lock'
            - 'Cargo.toml'
            - 'VERSION'
            - 'api/**'
            - 'crates/**'
            - 'fuzz/**'
            - 'deny.toml'
            - 'package.json'
            - 'rust-toolchain.toml'
            - 'rust-miri-toolchain.toml'
            - 'rustfmt.toml'
            - 'scripts/benchmark-rust-readonly.mjs'
            - 'scripts/build-browser.mjs'
            - 'scripts/run-rust.mjs'
            - 'scripts/verify-rust-*.mjs'
            - 'src/browser/wasm/**'
            - 'tests/browser/wasm-index.test.js'
            - 'tests/fixtures/rust-*.json'
            - 'xtask/**'
    push:
        branches:
            - main
            - codex/rust-rewrite
        paths:
            - '.github/workflows/rust.yml'
            - 'Cargo.lock'
            - 'Cargo.toml'
            - 'VERSION'
            - 'api/**'
            - 'crates/**'
            - 'fuzz/**'
            - 'deny.toml'
            - 'package.json'
            - 'rust-toolchain.toml'
            - 'rust-miri-toolchain.toml'
            - 'rustfmt.toml'
            - 'scripts/benchmark-rust-readonly.mjs'
            - 'scripts/build-browser.mjs'
            - 'scripts/run-rust.mjs'
            - 'scripts/verify-rust-*.mjs'
            - 'src/browser/wasm/**'
            - 'tests/browser/wasm-index.test.js'
            - 'tests/fixtures/rust-*.json'
            - 'xtask/**'

permissions:
    contents: read

concurrency:
    group: rust-${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    quality:
        name: Format, lint, test, and dependency policy
        runs-on: ubuntu-latest
        timeout-minutes: 20

        steps:
            - name: Check out source
              uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

            - name: Set up Bun
              uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
              with:
                  bun-version-file: .bun-version

            - name: Install JavaScript dependencies
              run: bun install --frozen-lockfile

            - name: Install pinned Rust toolchain
              run: rustup show active-toolchain

            - name: Verify workspace identity
              run: bun run rust:verify

            - name: Verify versioned contracts
              run: |
                  bun run contracts:verify
                  bun run query:verify
                  bun run predicate:verify
                  bun run sql:verify

            - name: Check Rust formatting
              run: bun run rust:fmt

            - name: Run Clippy
              run: bun run rust:clippy

            - name: Run Rust tests
              run: bun run rust:test

            - name: Verify JavaScript-to-Rust read-only interoperability
              run: |
                  bun run rust:interop:readonly
                  bun run golden:smoke

            - name: Install cargo-deny
              run: bun ./scripts/run-rust.mjs cargo install cargo-deny --version 0.19.4 --locked

            - name: Check dependency policy
              run: bun run rust:deny

    wasm:
        name: Wasm target and browser fallback
        runs-on: ubuntu-latest
        timeout-minutes: 20

        steps:
            - name: Check out source
              uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

            - name: Set up Bun
              uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
              with:
                  bun-version-file: .bun-version

            - name: Install dependencies
              run: bun install --frozen-lockfile

            - name: Install pinned Rust toolchain
              run: rustup show active-toolchain

            - name: Build browser client with Wasm
              run: bun run build:web:wasm

            - name: Run Wasm integration and fallback tests
              run: bun test tests/browser/wasm-index.test.js --timeout 120000 --parallel=1
              env:
                  FYLO_REQUIRE_WASM: '1'

    portable-miri:
        name: Portable kernel under Miri
        runs-on: ubuntu-latest
        timeout-minutes: 20

        steps:
            - name: Check out source
              uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

            - name: Install pinned Miri toolchain
              run: |
                  rustup toolchain install nightly-2026-07-20 --profile minimal --component miri,rust-src
                  cargo +nightly-2026-07-20 miri setup

            - name: Run portable crates under Miri
              run: cargo +nightly-2026-07-20 miri test -p fylo-format -p fylo-query --lib --tests

    native-read-only:
        name: Native read-only (${{ matrix.os }})
        runs-on: ${{ matrix.os }}
        timeout-minutes: 25
        strategy:
            fail-fast: false
            matrix:
                os: [ubuntu-latest, macos-latest, windows-latest]

        steps:
            - name: Check out source
              uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

            - name: Set up Bun
              uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
              with:
                  bun-version-file: .bun-version

            - name: Install dependencies
              run: bun install --frozen-lockfile

            - name: Install pinned Rust toolchain
              run: rustup show active-toolchain

            - name: Test native read-only crates
              run: bun ./scripts/run-rust.mjs cargo test --locked -p fylo-storage-native -p fylo-engine -p fylo-cli

            - name: Verify current-engine interoperability
              run: bun run rust:interop:readonly

            - name: Benchmark current and native read-only engines
              run: >-
                  bun ./scripts/benchmark-rust-readonly.mjs
                  --documents 250
                  --iterations 40
                  --warmup 10
                  --output target/benchmarks/read-only-${{ runner.os }}.json

            - name: Retain read-only benchmark evidence
              uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
              with:
                  name: rust-read-only-benchmark-${{ runner.os }}
                  path: target/benchmarks/read-only-${{ runner.os }}.json
                  if-no-files-found: error
                  retention-days: 30
