name: CI

on:
    workflow_call:
    push:
        branches: [main, codex/rust-rewrite]
    pull_request:
        branches: [main]
        types: [opened, synchronize, reopened, ready_for_review]
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: ci-${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

env:
    CARGO_TERM_COLOR: always
    RUST_BACKTRACE: '1'

jobs:
    quality:
        name: Rust quality, contracts, and browser units
        runs-on: ubuntu-24.04
        timeout-minutes: 35

        steps:
            - name: Checkout
              uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

            - name: Setup Bun
              uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
              with:
                  bun-version-file: .bun-version

            - name: Install dependencies and verified vendor binaries
              run: |
                  bun install --frozen-lockfile
                  sh ./scripts/install-vendor-bins.sh
                  echo "$HOME/.local/bin" >> "$GITHUB_PATH"

            - name: Install pinned Rust toolchain
              run: rustup show active-toolchain

            - name: Verify Rust-only product boundary and contracts
              run: |
                  bun run contracts:verify
                  bun run rust:verify
                  bun run query:verify
                  bun run predicate:verify
                  bun run sql:verify

            - name: Check formatting, compilation, Clippy, and tests
              run: |
                  bun run rust:fmt
                  bun run rust:check
                  bun run rust:clippy
                  bun run rust:test
                  bun ./scripts/run-rust.mjs cargo build --locked -p fylo-cli --bin fylo-rust

            - name: Build warning-free public documentation
              run: bun run rust:doc
              env:
                  RUSTDOCFLAGS: -D warnings

            - name: Check JavaScript host and client surfaces
              run: |
                  bun run typecheck
                  bun run lint
                  bun test tests/browser/*.test.js --timeout 120000 --parallel=1

    supply-chain:
        name: Dependency, license, and source policy
        runs-on: ubuntu-24.04
        timeout-minutes: 25

        steps:
            - name: Checkout
              uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

            - name: Setup Bun
              uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
              with:
                  bun-version-file: .bun-version

            - name: Install pinned Rust toolchain
              run: rustup show active-toolchain

            - name: Install pinned cargo-deny
              run: bun ./scripts/run-rust.mjs cargo install cargo-deny --version 0.19.7 --locked

            - name: Check dependency, license, advisory, and source policy
              run: bun run rust:deny

    coverage:
        name: Rust workspace coverage ratchet
        runs-on: ubuntu-24.04
        timeout-minutes: 30

        steps:
            - name: Checkout
              uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

            - name: Setup Bun
              uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
              with:
                  bun-version-file: .bun-version

            - name: Install pinned coverage support
              run: |
                  set -euo pipefail
                  toolchain=$(grep -oE 'channel *= *"[^"]+"' rust-toolchain.toml | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')
                  rustup component add llvm-tools-preview --toolchain "$toolchain"
                  bun ./scripts/run-rust.mjs cargo install cargo-llvm-cov --version 0.8.6 --locked

            - name: Enforce the measured whole-workspace coverage floor
              run: bun run rust:coverage

            - name: Retain machine-readable coverage evidence
              uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
              with:
                  name: rust-coverage-${{ github.sha }}
                  path: target/coverage.lcov
                  if-no-files-found: error
                  retention-days: 90

    provenance:
        name: SBOM and auditable binary evidence
        runs-on: ubuntu-24.04
        timeout-minutes: 35

        steps:
            - name: Checkout
              uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

            - name: Setup Bun
              uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
              with:
                  bun-version-file: .bun-version

            - name: Install pinned Rust toolchain
              run: rustup show active-toolchain

            - name: Install pinned SBOM and auditable-build tools
              run: |
                  bun ./scripts/run-rust.mjs cargo install cargo-cyclonedx --version 0.5.7 --locked
                  bun ./scripts/run-rust.mjs cargo install cargo-auditable --version 0.7.0 --locked

            - name: Generate CycloneDX bills of materials
              run: bun ./scripts/run-rust.mjs cargo cyclonedx --all --format json

            - name: Build a release executable with its dependency list embedded
              run: >-
                  bun ./scripts/run-rust.mjs cargo auditable build
                  --release --locked -p fylo-cli --bin fylo-rust

            - name: Retain provenance inputs
              uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
              with:
                  name: rust-provenance-${{ github.sha }}
                  path: |
                      **/*.cdx.json
                      target/release/fylo-rust
                  if-no-files-found: error
                  retention-days: 90

    portable-artifacts:
        name: Portable WASI and browser artifacts
        runs-on: ubuntu-24.04
        timeout-minutes: 35

        steps:
            - name: Checkout
              uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

            - name: Setup Bun
              uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
              with:
                  bun-version-file: .bun-version

            - name: Install dependencies
              run: bun install --frozen-lockfile

            - name: Install pinned Rust targets
              run: |
                  set -euo pipefail
                  toolchain=$(grep -oE 'channel *= *"[^"]+"' rust-toolchain.toml | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')
                  rustup target add wasm32-wasip1 wasm32-unknown-unknown --toolchain "$toolchain"

            - name: Build native, WASI, and browser engines
              run: |
                  bun ./scripts/run-rust.mjs cargo build --release --locked -p fylo-cli --bin fylo-rust
                  bun run rust:build:wasi
                  bun run build:web:wasm

            - name: Verify portable artifact contracts
              run: |
                  bun run rust:interchange
                  bun run rust:browser:host
                  bun ./scripts/verify-browser-wasm-budgets.mjs --output target/wasm-budget-portable.json

            - name: Retain portable artifact evidence
              uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
              with:
                  name: rust-portable-${{ github.sha }}
                  path: |
                      target/interchange/artifact-interchange.json
                      target/browser/browser-wasm-host.json
                      target/wasm-budget-portable.json
                  if-no-files-found: error
                  retention-days: 90

    native:
        name: Native Rust safety (${{ matrix.target }})
        runs-on: ${{ matrix.os }}
        timeout-minutes: 50
        strategy:
            fail-fast: false
            matrix:
                include:
                    - os: ubuntu-24.04
                      target: linux-x64
                      asset: fylo-rust-linux-x64
                    - os: macos-15
                      target: macos-arm64
                      asset: fylo-rust-macos-arm64
                    - os: windows-2022
                      target: windows-x64-2022
                      asset: fylo-rust-windows-x64.exe
                    - os: windows-2025
                      target: windows-x64-2025
                      asset: fylo-rust-windows-x64.exe

        steps:
            - name: Checkout
              uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

            - name: Setup Bun
              uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
              with:
                  bun-version-file: .bun-version

            - name: Install dependencies
              run: bun install --frozen-lockfile

            - name: Install verified vendor binaries
              shell: bash
              run: |
                  sh ./scripts/install-vendor-bins.sh
                  if command -v cygpath >/dev/null 2>&1; then
                      cygpath -w "$HOME/.local/bin" >> "$GITHUB_PATH"
                  else
                      echo "$HOME/.local/bin" >> "$GITHUB_PATH"
                  fi

            - name: Install pinned Rust toolchain
              run: rustup show active-toolchain

            - name: Lint native target-specific paths
              run: bun run rust:clippy

            - name: Test native storage, engine, machine, and CLI
              run: >-
                  bun ./scripts/run-rust.mjs cargo test --locked
                  -p fylo-storage-native -p fylo-engine -p fylo-machine -p fylo-cli

            - name: Build exact Rust candidate
              shell: bash
              env:
                  ASSET: ${{ matrix.asset }}
                  FYLO_BUILD_COMMIT: ${{ github.sha }}
                  FYLO_BUILD_KIND: native-rust-preview
              run: bun ./scripts/build-executable.mjs --outfile "target/native/$ASSET"

            - name: Verify exact binary identity and root ownership
              env:
                  FYLO_BINARY: target/native/${{ matrix.asset }}
                  FYLO_REQUIRE_NATIVE_BINARY: '1'
                  FYLO_EXPECT_BUILD_KIND: native-rust-preview
                  FYLO_EXPECT_COMMIT: ${{ github.sha }}
              run: bun test tests/interop/native-release-root-lease.test.js --timeout 120000 --parallel=1

            - name: Verify native Windows filesystem behavior
              if: runner.os == 'Windows'
              env:
                  FYLO_REQUIRE_WINDOWS_NATIVE: '1'
                  FYLO_WINDOWS_BINARY: target/native/${{ matrix.asset }}
                  FYLO_BUILD_COMMIT: ${{ github.sha }}
                  FYLO_EXPECT_BUILD_KIND: native-rust-preview
                  FYLO_EXPECT_COMMIT: ${{ github.sha }}
              run: bun test tests/interop/windows-native-binary.test.js --timeout 120000 --parallel=1

            - name: Recover every interrupted durable transition
              run: bun run rust:crash:matrix

            - name: Run model-checked Rust soak smoke
              shell: bash
              env:
                  FYLO_RUST_BINARY: target/native/${{ matrix.asset }}
                  FYLO_SKIP_RUST_BUILD: '1'
              run: >-
                  bun ./scripts/run-rust-soak.mjs --iterations 100
                  --output target/soak/${{ matrix.target }}.json

            - name: Stage checksummed candidate
              shell: bash
              env:
                  FYLO_CANDIDATE_LABEL: ${{ matrix.target }}
              run: >-
                  bun ./scripts/stage-rust-candidate.mjs
                  --binary target/native/${{ matrix.asset }}
                  --label "$FYLO_CANDIDATE_LABEL"
                  --output target/candidate

            - name: Retain native candidate and soak evidence
              uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
              with:
                  name: rust-native-${{ matrix.target }}-${{ github.sha }}
                  path: |
                      target/candidate
                      target/soak/${{ matrix.target }}.json
                  if-no-files-found: error
                  retention-days: 90

    browser:
        name: Browser Wasm and OPFS (${{ matrix.browser }})
        runs-on: ubuntu-24.04
        timeout-minutes: 30
        strategy:
            fail-fast: false
            matrix:
                browser: [chromium, firefox, webkit]

        steps:
            - name: Checkout
              uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

            - name: Setup Bun
              uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
              with:
                  bun-version-file: .bun-version

            - name: Install dependencies and browser
              run: |
                  bun install --frozen-lockfile
                  node ./node_modules/@playwright/test/cli.js install --with-deps ${{ matrix.browser }}

            - name: Install pinned Rust toolchain
              run: rustup show active-toolchain

            - name: Build browser host and Wasm kernel
              run: bun run build:web:wasm

            - name: Enforce browser payload budgets
              run: >-
                  bun ./scripts/verify-browser-wasm-budgets.mjs
                  --output target/wasm-budget-${{ matrix.browser }}.json

            - name: Run real-browser OPFS, restart, and fallback corpus
              run: node ./node_modules/@playwright/test/cli.js test --project=${{ matrix.browser }}

            - name: Retain browser evidence
              if: always()
              uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
              with:
                  name: rust-browser-${{ matrix.browser }}-${{ github.sha }}
                  path: |
                      target/wasm-budget-${{ matrix.browser }}.json
                      test-results
                      playwright-report
                  if-no-files-found: warn
                  retention-days: 90

    binary-interop:
        name: Compiled binary and published clients
        runs-on: macos-15
        timeout-minutes: 40

        steps:
            - name: Checkout
              uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

            - name: Setup Bun
              uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
              with:
                  bun-version-file: .bun-version

            - name: Setup Node
              uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
              with:
                  node-version: '24'

            - name: Setup Dart
              uses: dart-lang/setup-dart@65eb853c7ba17dde3be364c3d2858773e7144260 # v1

            - name: Setup PHP
              uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
              with:
                  php-version: '8.3'

            - name: Setup .NET
              uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
              with:
                  dotnet-version: '8.0.x'

            - name: Setup Go
              uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
              with:
                  go-version: '1.22'

            - name: Install Kotlin compiler and project dependencies
              run: |
                  sh ./scripts/install-kotlin-compiler.sh
                  bun install --frozen-lockfile
                  (cd website && bun install --frozen-lockfile)
                  (cd explorer && bun install --frozen-lockfile)
                  sh ./scripts/install-vendor-bins.sh
                  echo "$HOME/.local/bin" >> "$GITHUB_PATH"

            - name: Install pinned Rust toolchain
              run: rustup show active-toolchain

            - name: Build native Rust executable
              env:
                  FYLO_BUILD_COMMIT: ${{ github.sha }}
                  FYLO_BUILD_KIND: native-rust-preview
              run: bun run build:exe

            - name: Run binary, client, installer, website, and Explorer interop
              env:
                  FYLO_SKIP_BINARY_BUILD: '1'
                  FYLO_EXPECT_BUILD_KIND: native-rust-preview
                  FYLO_EXPECT_COMMIT: ${{ github.sha }}
              run: bun run test:interop

            - name: Run every published language client against Rust
              env:
                  FYLO_RUST_BINARY: dist-bin/fylo
                  FYLO_SKIP_RUST_BUILD: '1'
              run: bun ./scripts/verify-rust-language-clients.mjs

    miri:
        name: Portable kernel under Miri
        runs-on: ubuntu-24.04
        timeout-minutes: 20

        steps:
            - name: Checkout
              uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

            - name: Install pinned Miri toolchain
              run: |
                  rustup toolchain install nightly-2026-07-20 --profile minimal --component miri
                  cargo +nightly-2026-07-20 miri setup

            - name: Run portable crates under Miri
              run: cargo +nightly-2026-07-20 miri test -p fylo-format -p fylo-query --lib --tests
